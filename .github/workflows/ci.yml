name: Lepton CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch:
    inputs:
      ROOTFS_VERSION:
        description: 'Android 11: GitLab ref, latest release, or empty to rebuild.'
        type: string
        default: latest
        required: false
      ROOTFS14_VERSION:
        description: 'Android 14: GitLab ref, latest release, or empty to rebuild.'
        type: string
        default: latest
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  ROOTFS_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.ROOTFS_VERSION || github.event_name != 'workflow_dispatch' && 'latest' || '' }}
  ROOTFS14_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.ROOTFS14_VERSION || github.event_name != 'workflow_dispatch' && 'latest' || '' }}
  CI_API_V4_URL: https://gitlab.steamos.cloud/api/v4
  CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_COMMIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  CI_COMMIT_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || '' }}
  CI_PIPELINE_SOURCE: ${{ github.event_name == 'pull_request' && 'merge_request_event' || github.event_name }}

jobs:

  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.result }}
    steps:
      - uses: actions/github-script@v9
        id: filter
        with:
          script: |
            if (context.eventName === 'pull_request') {
              return context.payload.pull_request.head.repo.full_name === context.repo.owner + '/' + context.repo.repo;
            }
            if (context.eventName === 'push' && context.ref.startsWith('refs/heads/')) {
              const pulls = await github.rest.pulls.list({
                ...context.repo, state: 'open',
                head: context.repo.owner + ':' + context.ref.slice('refs/heads/'.length),
                per_page: 1,
              });
              return pulls.data.length === 0;
            }
            return true;

  build-compat-tool-job:
    needs:
      - pipeline
    if: github.repository == 'wallentx/lepton' && (needs.pipeline.outputs.run == 'true')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - x86_64-linux-kvm-docker
    container:
      image: ubuntu:24.04
      options: --user 0
    timeout-minutes: 360
    steps:
      - name: Install checkout dependencies
        run: |
          apt-get -qq update
          apt-get install -y git ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/checkout
        if: github.repository == 'wallentx/lepton'
        with:
          username: ${{ secrets.BUILD_TOKEN_USER }}
          password: ${{ secrets.BUILD_TOKEN_PASSWORD }}
      - name: Build and test
        run: |-
          ./.ci_scripts/install-build-compat_tool-dependencies.sh
          ./.ci_scripts/build-compat_tool.sh
      - name: Upload artifacts
        uses: ./.github/actions/upload
        with:
          name: build-compat-tool-job
          paths: compat_tool.tar.zst

  build-rootfs-job:
    needs:
      - pipeline
    if: github.repository == 'wallentx/lepton' && (needs.pipeline.outputs.run == 'true')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - x86_64-linux-kvm-docker-largedisk
    container:
      image: ubuntu:22.04
      options: --user 0
    timeout-minutes: 480
    env:
      IMAGE_DIR: image
      ROOTFS_VERSION_VAR: ROOTFS_VERSION
      BUILD_SCRIPT: build-rootfs.sh
      DEPENDENCIES_SCRIPT: install-build-rootfs-dependencies.sh
      JOB_NAME: build-rootfs-job
      SYMBOLS: symbols.tar.zst
    steps:
      - name: Install checkout dependencies
        run: |
          apt-get -qq update
          apt-get install -y git ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/checkout
        if: github.repository == 'wallentx/lepton'
        with:
          username: ${{ secrets.BUILD_TOKEN_USER }}
          password: ${{ secrets.BUILD_TOKEN_PASSWORD }}
      - name: Build and test
        if: github.repository == 'wallentx/lepton'
        run: bash .ci_scripts/github-build-rootfs.sh
        env:
          BUILD_TOKEN_USER: ${{ secrets.BUILD_TOKEN_USER }}
          BUILD_TOKEN_PASSWORD: ${{ secrets.BUILD_TOKEN_PASSWORD }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.https://gitlab.steamos.cloud.helper
          GIT_CONFIG_VALUE_0: '!f() { if [ "$1" = get ]; then printf ''username=%s\npassword=%s\n'' "$BUILD_TOKEN_USER" "$BUILD_TOKEN_PASSWORD"; fi; }; f'
          CI_LEPTON_TOKEN: ${{ secrets.CI_LEPTON_TOKEN }}
      - name: Upload artifacts
        uses: ./.github/actions/upload
        with:
          name: build-rootfs-job
          paths: |-
            image/system.img
            image/vendor.img
            image/NOTICE.txt
            image/version.txt
            image/output/out/verbose.log.gz
            symbols.tar.zst
        if: always()

  build-rootfs-14-job:
    needs:
      - pipeline
    if: github.repository == 'wallentx/lepton' && (needs.pipeline.outputs.run == 'true')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - x86_64-linux-kvm-docker-largedisk
    container:
      image: ubuntu:22.04
      options: --user 0
    timeout-minutes: 480
    env:
      IMAGE_DIR: image-14
      ROOTFS_VERSION_VAR: ROOTFS14_VERSION
      BUILD_SCRIPT: build-rootfs-14.sh
      DEPENDENCIES_SCRIPT: install-build-rootfs-14-dependencies.sh
      JOB_NAME: build-rootfs-14-job
      SYMBOLS: symbols.tar.zst
    steps:
      - name: Install checkout dependencies
        run: |
          apt-get -qq update
          apt-get install -y git ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/checkout
        if: github.repository == 'wallentx/lepton'
        with:
          username: ${{ secrets.BUILD_TOKEN_USER }}
          password: ${{ secrets.BUILD_TOKEN_PASSWORD }}
      - name: Build and test
        if: github.repository == 'wallentx/lepton'
        run: bash .ci_scripts/github-build-rootfs.sh
        env:
          BUILD_TOKEN_USER: ${{ secrets.BUILD_TOKEN_USER }}
          BUILD_TOKEN_PASSWORD: ${{ secrets.BUILD_TOKEN_PASSWORD }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.https://gitlab.steamos.cloud.helper
          GIT_CONFIG_VALUE_0: '!f() { if [ "$1" = get ]; then printf ''username=%s\npassword=%s\n'' "$BUILD_TOKEN_USER" "$BUILD_TOKEN_PASSWORD"; fi; }; f'
          CI_LEPTON_TOKEN: ${{ secrets.CI_LEPTON_TOKEN }}
      - name: Upload artifacts
        uses: ./.github/actions/upload
        with:
          name: build-rootfs-14-job
          paths: |-
            image-14/system.img
            image-14/vendor.img
            image-14/NOTICE.txt
            image-14/version.txt
            image-14/output/out/verbose.log.gz
            symbols.tar.zst
        if: always()

  prepare-rootfs-job:
    needs:
      - pipeline
      - build-rootfs-job
    if: github.repository == 'wallentx/lepton' && (needs.pipeline.outputs.run == 'true')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - x86_64-linux-kvm-docker
    container:
      image: ubuntu:24.04
      options: --user 0
    timeout-minutes: 360
    env:
      IMAGE_DIR: image
      DEPENDENCIES_SCRIPT: install-prepare-rootfs-dependencies.sh
      PREPARE_SCRIPT: prepare-rootfs.sh
    steps:
      - name: Install checkout dependencies
        run: |
          apt-get -qq update
          apt-get install -y git ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/checkout
        if: github.repository == 'wallentx/lepton'
        with:
          username: ${{ secrets.BUILD_TOKEN_USER }}
          password: ${{ secrets.BUILD_TOKEN_PASSWORD }}
      - name: Download build-rootfs-job
        uses: ./.github/actions/download
        with:
          name: build-rootfs-job
      - name: Build and test
        run: |-
          set -euo pipefail
          test -f "$IMAGE_DIR"/system.img || exit 1
          test -f "$IMAGE_DIR"/vendor.img || exit 1
          test -f "$IMAGE_DIR"/NOTICE.txt || exit 1
          test -f "$IMAGE_DIR"/version.txt || exit 1

          "./.ci_scripts/${DEPENDENCIES_SCRIPT}"
          "./.ci_scripts/${PREPARE_SCRIPT}"
          test -f rootfs.tar.zst
      - name: Upload artifacts
        uses: ./.github/actions/upload
        with:
          name: prepare-rootfs-job
          paths: rootfs.tar.zst

  prepare-rootfs-14-job:
    needs:
      - pipeline
      - build-rootfs-14-job
    if: github.repository == 'wallentx/lepton' && (needs.pipeline.outputs.run == 'true')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - x86_64-linux-kvm-docker
    container:
      image: ubuntu:24.04
      options: --user 0
    timeout-minutes: 360
    env:
      IMAGE_DIR: image-14
      DEPENDENCIES_SCRIPT: install-prepare-rootfs-14-dependencies.sh
      PREPARE_SCRIPT: prepare-rootfs-14.sh
    steps:
      - name: Install checkout dependencies
        run: |
          apt-get -qq update
          apt-get install -y git ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/checkout
        if: github.repository == 'wallentx/lepton'
        with:
          username: ${{ secrets.BUILD_TOKEN_USER }}
          password: ${{ secrets.BUILD_TOKEN_PASSWORD }}
      - name: Download build-rootfs-14-job
        uses: ./.github/actions/download
        with:
          name: build-rootfs-14-job
      - name: Build and test
        run: |-
          set -euo pipefail
          test -f "$IMAGE_DIR"/system.img || exit 1
          test -f "$IMAGE_DIR"/vendor.img || exit 1
          test -f "$IMAGE_DIR"/NOTICE.txt || exit 1
          test -f "$IMAGE_DIR"/version.txt || exit 1

          "./.ci_scripts/${DEPENDENCIES_SCRIPT}"
          "./.ci_scripts/${PREPARE_SCRIPT}"
          test -f rootfs.tar.zst
      - name: Upload artifacts
        uses: ./.github/actions/upload
        with:
          name: prepare-rootfs-14-job
          paths: rootfs.tar.zst

  pre-sysbake-job:
    needs:
      - pipeline
    if: github.repository == 'wallentx/lepton' && (needs.pipeline.outputs.run == 'true')
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - aarch64-linux-docker-privileged
    container:
      image: debian:bookworm
      options: --privileged --user 0
    timeout-minutes: 360
    steps:
      - name: Install checkout dependencies
        run: |
          apt-get -qq update
          apt-get install -y git ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/checkout
        if: github.repository == 'wallentx/lepton'
        with:
          username: ${{ secrets.BUILD_TOKEN_USER }}
          password: ${{ secrets.BUILD_TOKEN_PASSWORD }}
      - name: Build and test
        run: |
          sed -i -e "s|Types\(.\) deb|Types\1 deb deb-src|g" /etc/apt/sources.list.d/debian.sources
          apt update
          apt-get install -y dpkg-dev git
          apt-get build-dep -y linux
          if ! apt-get install -y "linux-headers-$(uname -r)"; then
            echo 'Kernel version mismatch, ask @em and @pablo on discord to update the runner worker VM image. See https://gitlab.steamos.cloud/infrastructure/tasks/-/work_items/408'
            exit 1
          fi
          git clone https://github.com/choff/anbox-modules
          cd anbox-modules
          git checkout 1434f1ebf74135a99d17e83f25d8e23908efc4cf
          cd binder
          KERNEL_SRC="/usr/lib/modules/$(uname -r)/build"
          KVER=$(uname -r)
          if [[ ! -d "${KERNEL_SRC}" ]]; then
              echo "Missing headers for the running kernel: $KVER" >&2
              exit 1
          fi
          make KERNEL_SRC="${KERNEL_SRC}"
          echo 'Testing to make sure binder module is loadable'
          if ! insmod binder_linux.ko; then
            dmesg
            uname -a
            echo 'Unable to load binder module!'
            exit 1
          fi
      - name: Upload artifacts
        uses: ./.github/actions/upload
        with:
          name: pre-sysbake-job
          paths: anbox-modules/binder/binder_linux.ko

  sysbake-job:
    needs:
      - pipeline
      - pre-sysbake-job
      - build-compat-tool-job
      - prepare-rootfs-job
    if: github.repository == 'wallentx/lepton' && (needs.pipeline.outputs.run == 'true')
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - aarch64-linux-docker-privileged
    container:
      image: registry.gitlab.steamos.cloud/deckard/deckardos/holo/steamos-arm64-vr-sysimg:latest
      options: --privileged --user 0
      credentials:
        username: ${{ secrets.GITLAB_REGISTRY_USER }}
        password: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}
    timeout-minutes: 360
    env:
      SYSBAKE_DEPENDENCIES_SCRIPT: install-sysbake-dependencies.sh
      SYSBAKE_SCRIPT: build-sysbake.sh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/checkout
        if: github.repository == 'wallentx/lepton'
        with:
          username: ${{ secrets.BUILD_TOKEN_USER }}
          password: ${{ secrets.BUILD_TOKEN_PASSWORD }}
      - name: Download pre-sysbake-job
        uses: ./.github/actions/download
        with:
          name: pre-sysbake-job
      - name: Download build-compat-tool-job
        uses: ./.github/actions/download
        with:
          name: build-compat-tool-job
      - name: Download prepare-rootfs-job
        uses: ./.github/actions/download
        with:
          name: prepare-rootfs-job
      - name: Build and test
        run: |-
          uname -a
          insmod anbox-modules/binder/binder_linux.ko devices=binder,hwbinder,vndbinder || { dmesg; exit 1; }
          "./.ci_scripts/${SYSBAKE_DEPENDENCIES_SCRIPT}"
          mount --make-rshared /
          mkdir -p /run/user
          mkdir -p /home
          mkdir -p /home/steamos
          dd if=/dev/zero of=podman.img bs=1M count=2048
          mkfs.ext4 podman.img
          mount -o loop podman.img /home/steamos
          mount -o bind /home/steamos /tmp
          mount -o bind /home/steamos /run/user
          chown steamos:steamos -R /home/steamos
          mkdir -p "/run/user/$(id -u steamos)"
          chown steamos:steamos -R "/run/user/$(id -u steamos)"
          runuser -u steamos -- bash -c "./.ci_scripts/${SYSBAKE_SCRIPT}"
      - name: Upload artifacts
        uses: ./.github/actions/upload
        with:
          name: sysbake-job
          paths: |-
            install/sysbake.tar.zst
            install/sysbake.xattrs
            sysbake-dmesg.txt
            sysbake-logcat.txt
            lepton-sysbake-trace.txt
            lepton-logcat-trace.txt
            lepton-sysbake-strace.txt
        if: always()

  sysbake-14-job:
    needs:
      - pipeline
      - pre-sysbake-job
      - build-compat-tool-job
      - prepare-rootfs-14-job
    if: github.repository == 'wallentx/lepton' && (needs.pipeline.outputs.run == 'true')
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - aarch64-linux-docker-privileged
    container:
      image: registry.gitlab.steamos.cloud/deckard/deckardos/holo/steamos-arm64-vr-sysimg:latest
      options: --privileged --user 0
      credentials:
        username: ${{ secrets.GITLAB_REGISTRY_USER }}
        password: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}
    timeout-minutes: 360
    env:
      SYSBAKE_DEPENDENCIES_SCRIPT: install-sysbake-14-dependencies.sh
      SYSBAKE_SCRIPT: build-sysbake-14.sh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/checkout
        if: github.repository == 'wallentx/lepton'
        with:
          username: ${{ secrets.BUILD_TOKEN_USER }}
          password: ${{ secrets.BUILD_TOKEN_PASSWORD }}
      - name: Download pre-sysbake-job
        uses: ./.github/actions/download
        with:
          name: pre-sysbake-job
      - name: Download build-compat-tool-job
        uses: ./.github/actions/download
        with:
          name: build-compat-tool-job
      - name: Download prepare-rootfs-14-job
        uses: ./.github/actions/download
        with:
          name: prepare-rootfs-14-job
      - name: Build and test
        run: |-
          uname -a
          insmod anbox-modules/binder/binder_linux.ko devices=binder,hwbinder,vndbinder || { dmesg; exit 1; }
          "./.ci_scripts/${SYSBAKE_DEPENDENCIES_SCRIPT}"
          mount --make-rshared /
          mkdir -p /run/user
          mkdir -p /home
          mkdir -p /home/steamos
          dd if=/dev/zero of=podman.img bs=1M count=2048
          mkfs.ext4 podman.img
          mount -o loop podman.img /home/steamos
          mount -o bind /home/steamos /tmp
          mount -o bind /home/steamos /run/user
          chown steamos:steamos -R /home/steamos
          mkdir -p "/run/user/$(id -u steamos)"
          chown steamos:steamos -R "/run/user/$(id -u steamos)"
          runuser -u steamos -- bash -c "./.ci_scripts/${SYSBAKE_SCRIPT}"
      - name: Upload artifacts
        uses: ./.github/actions/upload
        with:
          name: sysbake-14-job
          paths: |-
            install/sysbake.tar.zst
            install/sysbake.xattrs
            sysbake-dmesg.txt
            sysbake-logcat.txt
            lepton-sysbake-trace.txt
            lepton-logcat-trace.txt
            lepton-sysbake-strace.txt
        if: always()

  build-test-apk-job:
    needs:
      - pipeline
    if: github.repository == 'wallentx/lepton' && (needs.pipeline.outputs.run == 'true')
    runs-on:
      - self-hosted
      - Linux
      - X64
      - x86_64-linux-kvm-docker
    container:
      image: registry.gitlab.steamos.cloud/deckard/deckardos/holo/android-arm64-package-builder-main:latest
      options: --user 0
      credentials:
        username: ${{ secrets.GITLAB_REGISTRY_USER }}
        password: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/checkout
        if: github.repository == 'wallentx/lepton'
        with:
          username: ${{ secrets.BUILD_TOKEN_USER }}
          password: ${{ secrets.BUILD_TOKEN_PASSWORD }}
      - name: Build and test
        run: |-
          ./.ci_scripts/install-build-test-apk-dependencies.sh
          ./.ci_scripts/build-test-apk.sh
          test -f tests/test-apk.apk || exit 1
          test -f tests/test-apk2.apk || exit 1
          test -f tests/test-apk3.apk || exit 1
          test -f tests/test-vulkan.apk || exit 1
      - name: Upload artifacts
        uses: ./.github/actions/upload
        with:
          name: build-test-apk-job
          paths: |-
            tests/test-apk.apk
            tests/test-apk2.apk
            tests/test-apk3.apk
            tests/test-vulkan.apk

  tests-job:
    needs:
      - pipeline
      - pre-sysbake-job
      - sysbake-job
      - build-compat-tool-job
      - prepare-rootfs-job
      - build-test-apk-job
    if: needs.pipeline.outputs.run == 'true'
    runs-on: ${{ github.repository == 'wallentx/lepton' && fromJSON(format('["self-hosted", "Linux", "ARM64", "{0}"]', matrix.runner)) || 'ubuntu-latest' }}
    container:
      image: registry.gitlab.steamos.cloud/deckard/deckardos/holo/steamos-arm64-vr-sysimg:latest
      options: --privileged --user 0
      credentials:
        username: ${{ secrets.GITLAB_REGISTRY_USER }}
        password: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            runner: aarch64-linux-docker-privileged
          - shard: 2
            runner: aarch64-linux-docker-privileged
          - shard: 3
            runner: aarch64-linux-docker-privileged
          - shard: 4
            runner: aarch64-linux-docker-privileged
          - shard: 5
            runner: aarch64-linux-docker-privileged
          - shard: 6
            runner: aarch64-linux-docker-privileged
          - shard: 7
            runner: aarch64-linux-docker-privileged
          - shard: 8
            runner: aarch64-linux-docker-privileged
          - shard: 9
            runner: aarch64-linux-docker-privileged
          - shard: 10
            runner: aarch64-linux-docker-privileged
          - shard: 11
            runner: aarch64-linux-docker-privileged
          - shard: 12
            runner: aarch64-linux-docker-privileged
          - shard: 13
            runner: aarch64-linux-docker-heavy-privileged
    env:
      CI_NODE_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/checkout
        if: github.repository == 'wallentx/lepton'
        with:
          username: ${{ secrets.BUILD_TOKEN_USER }}
          password: ${{ secrets.BUILD_TOKEN_PASSWORD }}
      - name: Download pre-sysbake-job
        uses: ./.github/actions/download
        with:
          name: pre-sysbake-job
      - name: Download sysbake-job
        uses: ./.github/actions/download
        with:
          name: sysbake-job
      - name: Download build-compat-tool-job
        uses: ./.github/actions/download
        with:
          name: build-compat-tool-job
      - name: Download prepare-rootfs-job
        uses: ./.github/actions/download
        with:
          name: prepare-rootfs-job
      - name: Download build-test-apk-job
        uses: ./.github/actions/download
        with:
          name: build-test-apk-job
      - name: Build and test
        run: |-
          uname -a
          insmod anbox-modules/binder/binder_linux.ko devices=binder,hwbinder,vndbinder || { dmesg; exit 1; }
          ./.ci_scripts/install-tests-dependencies.sh
          mount --make-rshared /
          mkdir -p /run/user
          mkdir -p /home
          mkdir -p /home/steamos
          dd if=/dev/zero of=podman.img bs=1M count=10240
          mkfs.ext4 podman.img
          mount -o loop podman.img /home/steamos
          mount -o bind /home/steamos /tmp
          mount -o bind /home/steamos /run/user
          chown steamos:steamos -R /home/steamos
          mkdir -p "/run/user/$(id -u steamos)"
          chown steamos:steamos -R "/run/user/$(id -u steamos)"
          sysctl -w kernel.keys.maxkeys=1000000
          runuser -u steamos -- bash -c "./.ci_scripts/run-tests.sh $CI_NODE_INDEX"
      - name: Upload artifacts
        uses: ./.github/actions/upload
        with:
          name: tests-job-${{ matrix.shard }}
          paths: |-
            test-output.log
            test-trace.log
            test-dmesg.log
        if: always()

  tests-14-job:
    needs:
      - pipeline
      - pre-sysbake-job
      - sysbake-14-job
      - build-compat-tool-job
      - prepare-rootfs-14-job
      - build-test-apk-job
    if: needs.pipeline.outputs.run == 'true'
    runs-on: ${{ github.repository == 'wallentx/lepton' && fromJSON(format('["self-hosted", "Linux", "ARM64", "{0}"]', matrix.runner)) || 'ubuntu-latest' }}
    container:
      image: registry.gitlab.steamos.cloud/deckard/deckardos/holo/steamos-arm64-vr-sysimg:latest
      options: --privileged --user 0
      credentials:
        username: ${{ secrets.GITLAB_REGISTRY_USER }}
        password: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            runner: aarch64-linux-docker-privileged
          - shard: 2
            runner: aarch64-linux-docker-privileged
          - shard: 3
            runner: aarch64-linux-docker-privileged
          - shard: 4
            runner: aarch64-linux-docker-privileged
          - shard: 5
            runner: aarch64-linux-docker-privileged
          - shard: 6
            runner: aarch64-linux-docker-privileged
          - shard: 7
            runner: aarch64-linux-docker-privileged
          - shard: 8
            runner: aarch64-linux-docker-privileged
          - shard: 9
            runner: aarch64-linux-docker-privileged
          - shard: 10
            runner: aarch64-linux-docker-privileged
          - shard: 11
            runner: aarch64-linux-docker-privileged
          - shard: 12
            runner: aarch64-linux-docker-privileged
          - shard: 13
            runner: aarch64-linux-docker-heavy-privileged
    env:
      CI_NODE_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/checkout
        if: github.repository == 'wallentx/lepton'
        with:
          username: ${{ secrets.BUILD_TOKEN_USER }}
          password: ${{ secrets.BUILD_TOKEN_PASSWORD }}
      - name: Download pre-sysbake-job
        uses: ./.github/actions/download
        with:
          name: pre-sysbake-job
      - name: Download sysbake-14-job
        uses: ./.github/actions/download
        with:
          name: sysbake-14-job
      - name: Download build-compat-tool-job
        uses: ./.github/actions/download
        with:
          name: build-compat-tool-job
      - name: Download prepare-rootfs-14-job
        uses: ./.github/actions/download
        with:
          name: prepare-rootfs-14-job
      - name: Download build-test-apk-job
        uses: ./.github/actions/download
        with:
          name: build-test-apk-job
      - name: Build and test
        run: |-
          uname -a
          insmod anbox-modules/binder/binder_linux.ko devices=binder,hwbinder,vndbinder || { dmesg; exit 1; }
          ./.ci_scripts/install-tests-dependencies.sh
          mount --make-rshared /
          mkdir -p /run/user
          mkdir -p /home
          mkdir -p /home/steamos
          dd if=/dev/zero of=podman.img bs=1M count=10240
          mkfs.ext4 podman.img
          mount -o loop podman.img /home/steamos
          mount -o bind /home/steamos /tmp
          mount -o bind /home/steamos /run/user
          chown steamos:steamos -R /home/steamos
          mkdir -p "/run/user/$(id -u steamos)"
          chown steamos:steamos -R "/run/user/$(id -u steamos)"
          sysctl -w kernel.keys.maxkeys=1000000
          runuser -u steamos -- bash -c "./.ci_scripts/run-tests.sh $CI_NODE_INDEX"
      - name: Upload artifacts
        uses: ./.github/actions/upload
        with:
          name: tests-14-job-${{ matrix.shard }}
          paths: |-
            test-output.log
            test-trace.log
            test-dmesg.log
        if: always()
